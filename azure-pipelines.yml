name: FastAPI_Dev

trigger: none

resources:
- repo: self

variables:
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
  - group: FastAPI_Prod
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/stage') }}:
  - group: FastAPI_Stage
- ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/dev') }}:
  - group: FastAPI_Dev
- name: dockerRegistryServiceConnection
  value: 'efsme-manual'
- name: imageRepository
  value: 'fastapi'
- name: containerRegistry
  value: 'efsme.azurecr.io'
- name: dockerfilePath
  value: '**/Dockerfile'
- name: tag
  value: '$(Build.BuildId)'
- name: imagePullSecret
  value: 'efsme18394e34-auth'
- name: vmImageName
  value: 'ubuntu-latest'
- name: pythonVersion
  value: '3.12'

stages:

# -----------------------------------------------------------------------------
# SonarQube code analysis (runs on dev branch only)
# -----------------------------------------------------------------------------
- stage: Sonarqube
  displayName: Sonarqube
  condition: eq(variables['Build.SourceBranchName'], 'dev')
  jobs:
  - job: Sonarqube
    displayName: Sonarqube
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: self
      fetchDepth: 0

    - script: |
        echo "Disk space before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node
        sudo rm -rf /usr/local/share/chromium /usr/local/share/powershell
        sudo rm -rf /usr/share/az_* /opt/microsoft/msedge
        sudo apt-get clean 2>/dev/null || true
        sudo docker system prune -af --volumes 2>/dev/null || true
        echo "Disk space after cleanup:"
        df -h /
      displayName: 'Free up disk space'

    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'
        addToPath: true

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
      displayName: 'Install dependencies'

    - task: SonarSource.sonarqube.15B84CA1-B62F-4A2A-A403-89B77A063157.SonarQubePrepare@5
      displayName: 'Prepare analysis on SonarQube'
      inputs:
        SonarQube: 'sonarqube'
        projectKey: fastapi
        projectName: 'fastapi'
        scannerMode: CLI
        extraProperties: |
          sonar.projectKey=fastapi
          sonar.projectName=fastapi
          sonar.sources=.
          sonar.language=py
          sonar.python.version=3.12

    # - script: |
    #     pytest --cov=. --cov-report=xml
    #   displayName: 'Run tests and generate coverage report'

    - task: SonarSource.sonarqube.6D01813A-9589-4B15-8491-8164AEB38055.SonarQubeAnalyze@5
      displayName: 'Run Code Analysis'

    - task: SonarSource.sonarqube.291ed61f-1ee4-45d3-b1b0-bf822d9095ef.SonarQubePublish@5
      displayName: 'Publish Quality Gate Result'

# -----------------------------------------------------------------------------
# PR guardrails: block dev -> main PRs and enforce SonarQube Quality Gate
# -----------------------------------------------------------------------------
- stage: Sonarqube_Validations
  displayName: SonarQube Validation Check
  dependsOn: []
  condition: and(ne(variables['Build.SourceBranchName'], 'dev'), eq(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: Sonarqube_Validations
    displayName: Sonarqube_Validations
    pool:
      vmImage: $(vmImageName)
    steps:
    - checkout: none

    - script: |
        echo "Disk space before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node
        sudo rm -rf /usr/local/share/chromium /usr/local/share/powershell
        sudo rm -rf /usr/share/az_* /opt/microsoft/msedge
        sudo apt-get clean 2>/dev/null || true
        sudo docker system prune -af --volumes 2>/dev/null || true
        echo "Disk space after cleanup:"
        df -h /
      displayName: 'Free up disk space'

    - task: PowerShell@2
      displayName: 'Verify Source and Target Branches'
      inputs:
        targetType: 'inline'
        script: |
          # Variables for the source and target branches
          $sourceBranch = "$(System.PullRequest.SourceBranch)"
          $targetBranch = "$(System.PullRequest.TargetBranch)"

          # Block direct dev -> main PRs. Changes must go through stage.
          if ($sourceBranch -match 'refs/heads/dev' -and $targetBranch -match 'refs/heads/main') {
              Write-Host "##vso[task.logissue type=error]Pull requests from 'dev' to 'main' are not allowed. Please use 'stage' as the source branch."
              exit 1
          } else {
              Write-Host "Source and Target branch check passed."
          }

    - task: PowerShell@2
      displayName: 'Check SonarQube Quality Gate'
      inputs:
        targetType: 'inline'
        script: |
          $SONAR_URL = "http://20.166.79.229:9000/api/qualitygates/project_status?projectKey=fastapi"
          $SONAR_TOKEN = "fe0b3faf7e231fedb729a87853d61e3e060e0602"

          # Encode the token for basic authentication
          $encodedToken = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${SONAR_TOKEN}:"))
          $headers = @{
              Authorization = "Basic $encodedToken"
          }

          $response = Invoke-RestMethod -Uri $SONAR_URL -Headers $headers -Method Get
          $status = $response.projectStatus.status
          if ($status -eq "OK") {
              Write-Host "##vso[task.logissue type=info]SonarQube Quality Gate Passed."
          }
          else
          {
              Write-Host "##vso[task.logissue type=error]SonarQube Quality Gate Failed. Please review the issues and improve the code quality."
              exit 1
          }

# -----------------------------------------------------------------------------
# Build (Dev branch) - no quality-gate precondition so first push can build
# -----------------------------------------------------------------------------
- stage: Build_Dev
  displayName: Build stage
  dependsOn: []
  condition: and( eq(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest') )
  jobs:
  - job: Build
    timeoutInMinutes: 60
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:

    - checkout: self
      fetchDepth: 1

    - script: |
        echo "Disk space before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node
        sudo rm -rf /usr/local/share/chromium /usr/local/share/powershell
        sudo rm -rf /usr/share/az_* /opt/microsoft/msedge
        sudo apt-get clean 2>/dev/null || true
        sudo docker system prune -af --volumes
        echo "Disk space after cleanup:"
        df -h /
      displayName: 'Free up disk space'

    # Replace ${VAR} placeholders in the .env file with values from the
    # FastAPI_Dev / FastAPI_Stage / FastAPI_Prod variable group.
    # NOTE: the application reads secrets via python-dotenv (load_dotenv()) and
    # os.getenv() - e.g. SQL_DB in central/common.py. A tokenised .env file
    # must exist at the repository root with entries like:  SQL_DB=${SQL_DB}
    - task: replacetokens@5
      displayName: 'Replace tokens in .env'
      inputs:
        rootDirectory: '$(System.DefaultWorkingDirectory)'
        targetFiles: '.env'
        encoding: 'auto'
        tokenPattern: 'custom'
        tokenPrefix: '${'
        tokenSuffix: '}'
        writeBOM: true
        actionOnMissing: 'warn'
        keepToken: false
        actionOnNoFiles: 'continue'
        enableTransforms: false
        enableRecursion: false
        useLegacyPattern: false
        enableTelemetry: true

    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - upload: manifests
      artifact: manifests

# -----------------------------------------------------------------------------
# Build (Stage/Main) - gated on SonarQube Quality Gate
# -----------------------------------------------------------------------------
- stage: Build_Other
  displayName: Build stage
  dependsOn: []
  condition: and( ne(variables['Build.SourceBranch'], 'refs/heads/dev'), ne(variables['Build.Reason'], 'PullRequest') )
  jobs:
  - job: Build
    timeoutInMinutes: 60
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:

    - checkout: self
      fetchDepth: 1

    - script: |
        echo "Disk space before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo rm -rf /usr/share/swift /usr/local/graalvm /usr/local/.ghcup
        sudo rm -rf /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/node
        sudo rm -rf /usr/local/share/chromium /usr/local/share/powershell
        sudo rm -rf /usr/share/az_* /opt/microsoft/msedge
        sudo apt-get clean 2>/dev/null || true
        sudo docker system prune -af --volumes
        echo "Disk space after cleanup:"
        df -h /
      displayName: 'Free up disk space'

    - task: PowerShell@2
      displayName: 'Check SonarQube Quality Gate'
      inputs:
        targetType: 'inline'
        pwsh: true
        script: |
          $SONAR_URL = "http://20.166.79.229:9000/api/qualitygates/project_status?projectKey=fastapi"
          $SONAR_TOKEN = "fe0b3faf7e231fedb729a87853d61e3e060e0602"

          # Encode the token for basic authentication
          $encodedToken = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("${SONAR_TOKEN}:"))
          $headers = @{
              Authorization = "Basic $encodedToken"
          }

          $response = Invoke-RestMethod -Uri $SONAR_URL -Headers $headers -Method Get
          $status = $response.projectStatus.status

          if ($status -eq "OK") {
              Write-Host "SonarQube Quality Gate Passed."
              Write-Host "##vso[task.complete result=Succeeded;]Success: Quality Gate Passed"
          } else {
              Write-Host "SonarQube Quality Gate Failed. Please review the issues and improve the code quality."
              Write-Host "##vso[task.logissue type=error]SonarQube Quality Gate Failed"
              exit 1
          }

    - task: replacetokens@5
      displayName: 'Replace tokens in .env'
      inputs:
        rootDirectory: '$(System.DefaultWorkingDirectory)'
        targetFiles: '.env'
        encoding: 'auto'
        tokenPattern: 'custom'
        tokenPrefix: '${'
        tokenSuffix: '}'
        writeBOM: true
        actionOnMissing: 'warn'
        keepToken: false
        actionOnNoFiles: 'continue'
        enableTransforms: false
        enableRecursion: false
        useLegacyPattern: false
        enableTelemetry: true

    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - upload: manifests
      artifact: manifests

# -----------------------------------------------------------------------------
# Deploy to AKS (Dev / Stage / Prod) - reuses EFSIM AKS environments
# Manifests expected at:  manifests/<env>/deployment.yml  and  service.yml
# -----------------------------------------------------------------------------
- stage: Deploy_Dev
  displayName: Deploy Dev Environment
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'dev'))
  dependsOn: Build_Dev

  jobs:
  - deployment: Deploy
    timeoutInMinutes: 60
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'EFSIM-Dev.efs-dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/dev/deployment.yml
                $(Pipeline.Workspace)/manifests/dev/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)
              rolloutStatusTimeout: '1800'

- stage: Deploy_Stage
  displayName: Deploy Stage Environment
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'stage'))
  dependsOn: Build_Other

  jobs:
  - deployment: Deploy
    timeoutInMinutes: 60
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'EFSIM-Stage.efs-stage'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/stage/deployment.yml
                $(Pipeline.Workspace)/manifests/stage/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)
              rolloutStatusTimeout: '1800'

- stage: Deploy_Prod
  displayName: Deploy Production Environment
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))
  dependsOn: Build_Other

  jobs:
  - deployment: Deploy
    timeoutInMinutes: 60
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'EFSIM-Prod.efs-prod'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/prod/deployment.yml
                $(Pipeline.Workspace)/manifests/prod/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)
              rolloutStatusTimeout: '1800'
