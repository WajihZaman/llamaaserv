[project]
name = "llamaserv"
version = "0.1.0"
description = "running a local AI app as an HR Chatbot using llama-server. "
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt==4.0.1",
    "beautifulsoup4>=4.14.3",
    "chromadb>=1.4.1",
    "cryptography>=47.0.0",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "markdown>=3.10.2",
    "ollama>=0.6.1",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "pymupdf",
    "pymysql>=1.1.2",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.46",
    "uvicorn>=0.40.0",
]

